[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swiss-qr-payment"
version = "1.0.0"
description = "Swiss QR-bill payment code generator — SIX IG v2.3 compliant"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Nicola Spieser", email = "spieser.nicola@gmail.com" },
]
keywords = ["swiss", "qr-bill", "qr-rechnung", "payment", "spc", "einzahlungsschein", "qr-code"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "qrcode[pil]>=7.0",
    "Pillow>=9.0",
]

[project.optional-dependencies]
pdf = ["reportlab>=4.0"]
dev = ["pytest", "ruff"]
all = ["reportlab>=4.0", "pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/redbasecap/swiss-qr-payment"
Issues = "https://github.com/redbasecap/swiss-qr-payment/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/swiss_qr_payment"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
